name: ci

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: python3 scripts/release_preflight.py

      - name: Test release scripts
        run: python3 scripts/test_release_scripts.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (no default features)
        run: cargo clippy --locked -p openkeyv --no-default-features --all-targets -- -D warnings

      - name: Run tests (no default features)
        run: cargo test --locked -p openkeyv --no-default-features

      - name: Run tests (default features)
        run: cargo test --locked -p openkeyv

      - name: Check all features
        run: cargo check --locked -p openkeyv --all-features

  rust-msrv:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Check no default features
        run: cargo check --locked -p openkeyv --no-default-features

      - name: Check default features
        run: cargo check --locked -p openkeyv

      - name: Check all features
        run: cargo check --locked -p openkeyv --all-features

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Audit Rust release dependencies and licenses
        working-directory: rust
        run: cargo deny --locked check advisories licenses

  python-quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.24
          enable-cache: true

      - name: Sync dev environment
        run: uv sync --group dev --python 3.13

      - name: Lint
        run: uv run ruff check src tests

      - name: Typecheck
        run: uv run basedpyright

      - name: Test
        run: uv run pytest -q
