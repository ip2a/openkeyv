name: post-release-verify

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to verify (e.g., 0.1.5)"
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  verify-github-release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download GitHub Release assets
        shell: bash
        run: |
          mkdir -p release-assets
          gh release download "v${{ inputs.version }}" --dir release-assets --pattern 'openkeyv-*.crate'

      - name: Verify GitHub Release asset exists
        shell: bash
        run: |
          set -eu
          shopt -s nullglob
          crates=(release-assets/openkeyv-${{ inputs.version }}.crate)
          test "${#crates[@]}" -eq 1
          echo "[ok] GitHub Release contains openkeyv-${{ inputs.version }}.crate"

      - name: Verify GitHub Release provenance
        shell: bash
        run: |
          set -eu
          asset="release-assets/openkeyv-${{ inputs.version }}.crate"
          gh attestation verify "$asset" \
            --repo ip2a/openkeyv \
            --signer-workflow ip2a/openkeyv/.github/workflows/release-build.yml \
            --source-ref "refs/tags/v${{ inputs.version }}"

  verify-crates:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Verify crates.io library dependency
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          cd "${tmpdir}"
          cargo init --lib --name openkeyv_crates_verify
          cargo add openkeyv@${{ inputs.version }}
          # scheduled-thread-pool 0.2.8 (via r2d2 via memcache) landed without
          # rust-version metadata and pulls parking_lot 0.13, which requires
          # rustc 1.95; a fresh resolution cannot build on this MSRV pin.
          # Hold the last 1.85-compatible release until upstream declares one.
          cargo update scheduled-thread-pool --precise 0.2.7
          cargo check
          echo "[ok] crates.io library dependency verification passed"

  verify-crates-shm:
    name: verify-crates-shm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Test the released crate (shm contract, cross-process, crash recovery)
        shell: bash
        run: |
          set -eu
          tmpdir="$(mktemp -d)"
          cd "${tmpdir}"
          curl -sSfL "https://crates.io/api/v1/crates/openkeyv/${{ inputs.version }}/download" -o openkeyv.crate
          tar -xzf openkeyv.crate
          cargo test --locked --manifest-path "openkeyv-${{ inputs.version }}/Cargo.toml" --no-default-features --features "json shm shm-test-hooks"
          echo "[ok] crates.io released crate passes the shm suites"
