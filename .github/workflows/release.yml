name: Release

on:
  push:
    tags:
      - "v*"
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      python-version: ${{ steps.version.outputs.python-version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("rust/Cargo.toml").read_text())["workspace"]["package"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-rc\.\d+)?", version):
              raise SystemExit(f"unsupported Cargo release version: {version}")
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match Cargo version {version!r}")
          python_version = version.replace("-rc.", "rc")
          prerelease = "true" if "-rc." in version else "false"
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a") as stream:
              stream.write(f"version={version}\n")
              stream.write(f"python-version={python_version}\n")
              stream.write(f"prerelease={prerelease}\n")
          PY

  crate:
    name: Package Rust crate
    needs: validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: release-crate
      - run: cargo package --locked -p openkeyv
      - name: Verify packaged crate
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          archive="target/package/openkeyv-$VERSION.crate"
          test -f "$archive"
          mkdir package-check
          tar -xzf "$archive" -C package-check
          cargo test --locked --manifest-path "package-check/openkeyv-$VERSION/Cargo.toml" --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: rust-crate
          path: rust/target/package/openkeyv-${{ needs.validate.outputs.version }}.crate
          if-no-files-found: error

  wheel:
    name: Wheel (${{ matrix.name }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64
            manylinux: "2_28"
            python-versions: "3.10 3.11 3.12 3.13"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
            python-versions: "3.10 3.11 3.12 3.13"
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            python-versions: "3.10 3.13"
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            manylinux: "off"
            python-versions: "3.10 3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.24
          enable-cache: true
      - uses: PyO3/maturin-action@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Verify wheel metadata and supported interpreters
        shell: bash
        working-directory: python
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.python-version }}
          PYTHON_VERSIONS: ${{ matrix.python-versions }}
        run: |
          set -eu
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          source_archives=(dist/*.tar.gz)
          test "${#source_archives[@]}" -eq 0
          wheel="${wheels[0]}"
          [[ "$(basename "$wheel")" == openkeyv-"$EXPECTED_VERSION"-cp310-abi3-* ]]
          for version in $PYTHON_VERSIONS; do
            uv run --isolated --python "$version" --with "$wheel" python - <<'PY'
          import asyncio
          import openkeyv
          from openkeyv import MemoryStore, SimpleStore, SqliteStore

          assert set(openkeyv.__all__) == {
              "CompareAndDeleteResult",
              "CompareAndSwapResult",
              "DiskStore",
              "MemoryStore",
              "RedisStore",
              "Revision",
              "RevisionedValue",
              "SimpleStore",
              "SqliteStore",
              "ValkeyStore",
          }

          async def smoke() -> None:
              for store in (MemoryStore(), SimpleStore(), SqliteStore()):
                  await store.put("key", {"value": [1, True, None]})
                  assert await store.get("key") == {"value": [1, True, None]}
                  assert await store.delete("key") is True

          asyncio.run(smoke())
          PY
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: python/dist/*.whl
          if-no-files-found: error

  attest:
    name: Attest release artifacts
    needs: [crate, wheel]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: rust-crate
          path: dist
      - uses: actions/attest@v4
        with:
          subject-path: dist/*

  publish-crate:
    name: Publish crates.io
    needs: [validate, crate, wheel, attest]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Publish crate without overwriting an existing version
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p openkeyv

  publish-pypi:
    name: Publish PyPI
    needs: [validate, crate, wheel, attest]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    name: Create GitHub release
    needs: [validate, publish-crate, publish-pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: rust-crate
          path: dist
      - name: Publish immutable release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease_flag=""
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --generate-notes \
            $prerelease_flag \
            --notes "Supported Python wheels: Linux x86_64/aarch64 manylinux_2_28, Windows x86_64 MSVC, and macOS ARM64 11.0+. Python 3.10-3.13 is supported. The Rust crate exposes all backend features; the Python wheel contains Memory, Simple, Disk, SQLite, Redis, and Valkey. Real-service integration tests are not release-blocking."
