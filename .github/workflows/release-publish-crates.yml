name: release-publish-crates

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: crates
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release context
        shell: bash
        run: python3 scripts/validate_release_context.py

      - name: Validate release metadata
        shell: bash
        run: python3 scripts/release_preflight.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Read crate release version
        id: cargo_meta
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          cargo = tomllib.loads(Path("rust/Cargo.toml").read_text(encoding="utf-8"))
          print(cargo["workspace"]["package"]["version"])
          PY
          )"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Dry-run publish crate
        run: cargo publish --dry-run --locked --registry crates-io --manifest-path rust/crates/openkeyv/Cargo.toml

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate to crates.io
        shell: bash
        run: |
          version="${{ steps.cargo_meta.outputs.version }}"
          api_url="https://crates.io/api/v1/crates/openkeyv/${version}"
          user_agent="openkeyv-release-pipeline (https://github.com/ip2a/openkeyv)"
          # Idempotent re-run: a version already visible on the registry is
          # published and frozen, so re-uploading can only fail. Skip instead.
          if curl -s -A "${user_agent}" --fail "${api_url}" | grep -q "\"num\":\"${version}\""; then
            echo "[skip] openkeyv ${version} is already on crates.io"
            exit 0
          fi
          cargo publish --locked --registry crates-io --manifest-path rust/crates/openkeyv/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for crate on crates.io
        shell: bash
        run: |
          version="${{ steps.cargo_meta.outputs.version }}"
          api_url="https://crates.io/api/v1/crates/openkeyv/${version}"
          user_agent="openkeyv-release-pipeline (https://github.com/ip2a/openkeyv)"
          for attempt in $(seq 1 40); do
            response=$(curl -s -A "${user_agent}" --fail "${api_url}" || true)
            if [ -n "${response}" ] && echo "${response}" | grep -q "\"num\":\"${version}\""; then
              echo "[ok] openkeyv ${version} is visible on crates.io"
              exit 0
            fi
            echo "[info] Waiting for openkeyv ${version} to appear on crates.io (attempt ${attempt}/40)"
            sleep 15
          done
          echo "[error] openkeyv ${version} did not appear on crates.io in time"
          exit 1

      - name: Read bridge crate release version
        id: bridges_meta
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          cargo = tomllib.loads(Path("rust/crates/openkeyv-bridges/Cargo.toml").read_text(encoding="utf-8"))
          print(cargo["package"]["version"])
          PY
          )"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Dry-run publish bridge crate
        run: cargo publish --dry-run --locked --registry crates-io --manifest-path rust/crates/openkeyv-bridges/Cargo.toml

      - name: Publish bridge crate to crates.io
        shell: bash
        run: |
          version="${{ steps.bridges_meta.outputs.version }}"
          api_url="https://crates.io/api/v1/crates/openkeyv-bridges/${version}"
          user_agent="openkeyv-release-pipeline (https://github.com/ip2a/openkeyv)"
          if curl -s -A "${user_agent}" --fail "${api_url}" | grep -q "\"num\":\"${version}\""; then
            echo "[skip] openkeyv-bridges ${version} is already on crates.io"
            exit 0
          fi
          cargo publish --locked --registry crates-io --manifest-path rust/crates/openkeyv-bridges/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for bridge crate on crates.io
        shell: bash
        run: |
          version="${{ steps.bridges_meta.outputs.version }}"
          api_url="https://crates.io/api/v1/crates/openkeyv-bridges/${version}"
          user_agent="openkeyv-release-pipeline (https://github.com/ip2a/openkeyv)"
          for attempt in $(seq 1 40); do
            response=$(curl -s -A "${user_agent}" --fail "${api_url}" || true)
            if [ -n "${response}" ] && echo "${response}" | grep -q "\"num\":\"${version}\""; then
              echo "[ok] openkeyv-bridges ${version} is visible on crates.io"
              exit 0
            fi
            echo "[info] Waiting for openkeyv-bridges ${version} to appear on crates.io (attempt ${attempt}/40)"
            sleep 15
          done
          echo "[error] openkeyv-bridges ${version} did not appear on crates.io in time"
          exit 1
