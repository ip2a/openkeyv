[workspace]
members = ["crates/openkeyv"]
resolver = "3"

[workspace.package]
version = "0.4.4"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["whillhill"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1.44", features = ["full"] }
chrono = "0.4"
dashmap = "6.1"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = true
