[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "The optional sled backend has no maintained release that replaces instant; tracked until that backend can migrate without changing its storage contract." },
    { id = "RUSTSEC-2025-0012", reason = "firestore 0.48 depends on unmaintained backoff; no compatible upstream replacement is available." },
    { id = "RUSTSEC-2025-0057", reason = "The optional sled backend has no maintained release that replaces fxhash; tracked until that backend can migrate without changing its storage contract." },
    { id = "RUSTSEC-2025-0134", reason = "The Rust 1.85-compatible AWS SDK dependency line retains rustls-pemfile 1; no patched MSRV-compatible upgrade is available." },
    { id = "RUSTSEC-2026-0009", reason = "time 0.3.47 fixes this issue but requires Rust 1.88; 0.3.45 is the newest line compatible with the published Rust 1.85 MSRV." },
    { id = "RUSTSEC-2026-0098", reason = "The Rust 1.85-compatible AWS SDK dependency line retains rustls-webpki 0.101; no patched MSRV-compatible upgrade is available." },
    { id = "RUSTSEC-2026-0099", reason = "The Rust 1.85-compatible AWS SDK dependency line retains rustls-webpki 0.101; no patched MSRV-compatible upgrade is available." },
    { id = "RUSTSEC-2026-0104", reason = "The Rust 1.85-compatible AWS SDK dependency line retains rustls-webpki 0.101; no patched MSRV-compatible upgrade is available." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
