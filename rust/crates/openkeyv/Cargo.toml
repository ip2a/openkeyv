[package]
name = "openkeyv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Async Key-Value Store - A pluggable interface for KV Stores"
readme = "../../../README.md"
repository = "https://github.com/ip2a/openkeyv"
keywords = ["kv", "store", "async", "cache", "database"]
categories = ["database", "caching", "asynchronous"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
chrono.workspace = true
dashmap.workspace = true
tracing.workspace = true
blake3 = "1.8"
flate2 = "1.1"
base64 = "0.22"
bytes = "1.10"
getrandom = "0.3"
memmap2 = { version = "0.9" }
fs2 = { version = "0.4" }
sled = { version = "0.34" }
redis = { version = "0.29", features = ["tokio-comp", "connection-manager"] }
socket2 = { version = "0.5", features = ["all"] }
memcache = { version = "0.19", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"], optional = true }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"], optional = true }

[features]
default = []
python = ["dep:pyo3", "dep:pyo3-async-runtimes"]
# Placeholder chains until the python round redefines the wheel feature sets:
# the backend features they used to aggregate are gone (resident or bridged).
python-core = ["python"]
python-full = ["python-core"]
shm-test-hooks = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.14"
criterion.workspace = true

[[bench]]
name = "value_codec"
harness = false

[[bench]]
name = "memory_store"
harness = false

[[bench]]
name = "redis_store"
harness = false

[[bench]]
name = "shm_store"
harness = false

[[example]]
name = "shm_local"
