[package]
name = "openkeyv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Async Key-Value Store - A pluggable interface for KV Stores"
readme = "../../../README.md"
repository = "https://github.com/whillhill/openkeyv"
keywords = ["kv", "store", "async", "cache", "database"]
categories = ["database", "caching", "asynchronous"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
chrono.workspace = true
dashmap.workspace = true
tracing.workspace = true
blake3 = "1.8"
flate2 = "1.1"
base64 = "0.22"
bytes = "1.10"
getrandom = "0.3"

sled = { version = "0.34", optional = true }
redis = { version = "0.29", features = ["tokio-comp"], optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono"], optional = true }
mongodb = { version = "3.2", default-features = false, features = ["compat-3-0-0", "rustls-tls"], optional = true }
futures-util = { version = "0.3", optional = true }
rocksdb = { version = "0.23", features = ["multi-threaded-cf"], optional = true }
aws-config = { version = "=1.8.0", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process"], optional = true }
aws-sdk-dynamodb = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
duckdb = { version = "1.2", features = ["bundled", "chrono"], optional = true }
rusqlite = { version = "0.32", features = ["bundled", "chrono"], optional = true }
memcache = { version = "0.19", optional = true }
vaultrs = { version = "0.8", optional = true }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"], optional = true }
firestore = { version = "0.48", optional = true }
opensearch = { version = "2.4", optional = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"], optional = true }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"], optional = true }

[features]
default = ["disk", "redis", "rocksdb"]
json = ["dep:serde_json"]
disk = ["dep:sled"]
redis = ["dep:redis"]
postgres = ["dep:sqlx"]
mongodb = ["dep:mongodb", "dep:futures-util"]
rocksdb = ["dep:rocksdb"]
dynamodb = ["dep:aws-config", "dep:aws-sdk-dynamodb"]
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]
duckdb = ["dep:duckdb"]
sqlite = ["dep:rusqlite"]
memcached = ["dep:memcache"]
valkey = ["dep:redis"]
vault = ["dep:vaultrs", "dep:futures-util", "dep:serde", "dep:serde_json"]
keyring = ["dep:keyring"]
firestore = ["dep:firestore", "dep:futures-util", "dep:serde", "bytes/serde"]
opensearch = ["dep:opensearch", "dep:serde", "dep:serde_json"]
python = ["dep:pyo3", "dep:pyo3-async-runtimes"]
python-core = ["python", "disk", "redis", "sqlite", "valkey"]
python-full = ["python-core", "postgres", "mongodb", "rocksdb", "dynamodb", "s3", "duckdb", "memcached", "vault", "keyring", "firestore", "opensearch"]

[dev-dependencies]
gcloud-sdk = "0.29"
tokio-test = "0.4"
tempfile = "3.14"
criterion.workspace = true

[[bench]]
name = "value_codec"
harness = false

[[bench]]
name = "memory_store"
harness = false

[[bench]]
name = "redis_store"
harness = false
