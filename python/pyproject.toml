[project]
name = "openkeyv"
dynamic = ["version"]
description = "Async Key-Value Store - A pluggable interface for KV Stores"
readme = { text = "OpenKeyV is an async pluggable key-value store with a Rust core and Python bindings.", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "beartype>=0.20.0",
    "orjson>=3.0.0",
    "typing-extensions>=4.15.0",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../rust/crates/openkeyv/Cargo.toml"
module-name = "openkeyv._internal"
features = ["python-core"]
python-source = "src"
compatibility = "manylinux_2_28"
auditwheel = "repair"
exclude = ["**/__pycache__/**", "**/*.py[cod]"]

[project.optional-dependencies]
elasticsearch = ["elasticsearch>=8.0.0,<9.0.0", "aiohttp>=3.12"]
pydantic = ["pydantic>=2.11.9"]
aerospike = ["aerospike>=16.0.0"]
wrappers-encryption = ["cryptography>=45.0.0"]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.30.0",
    "mkdocstrings-python>=1.10.0",
]

[dependency-groups]
dev = [
    "openkeyv[elasticsearch]",
    "openkeyv[aerospike]; platform_system != 'Windows'",
    "openkeyv[pydantic]",
    "openkeyv[wrappers-encryption]",
    "ast-comments>=1.2.3",
    "basedpyright>=1.32.1",
    "dirty-equals>=0.10.0",
    "diskcache-stubs>=5.6.3.6.20240818",
    "docker>=7.1.0",
    "inline-snapshot>=0.30.1",
    "maturin>=1.0,<2.0",
    "testcontainers[redis,mongodb,elasticsearch,memcached,vault,generic]>=4.10.0",
    "pytest-asyncio>=1.2.0",
    "pytest-dotenv>=0.5.2",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pytest>=8.4.2",
    "ruff>=0.14.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "--inline-snapshot=disable",
    "-n=auto",
    "--dist=loadfile",
    "--maxfail=5",
    "--ignore=references",
]
markers = [
    "skip_on_ci: Skip running the test when running on CI",
]
timeout = 10
timeout_func_only = true
env_files = [".env"]

[tool.ruff]
target-version = "py310"
lint.fixable = ["ALL"]
lint.ignore = [
    "COM812",
    "PLR0913",
]
lint.extend-select = [
    "A",
    "ARG",
    "B",
    "C4",
    "COM",
    "DTZ",
    "E",
    "EM",
    "F",
    "FURB",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PLR",
    "PLW",
    "PT",
    "PTH",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
]
line-length = 140

[tool.ruff.lint.extend-per-file-ignores]
"**/tests/*.py" = [
    "S101",
    "S105",
    "S106",
    "DTZ005",
    "PLR2004",
    "E501",
    "ARG001",
    "ARG002",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportExplicitAny = false
reportMissingTypeStubs = false
reportPrivateUsage = false
reportUnnecessaryTypeIgnoreComment = true
include = [
    "src/openkeyv",
]
exclude = [
    "**/playground/**",
    "**/node_modules/**",
    "**/examples/**",
    "**/references/**",
    "**/docs/**",
    "**/.venv/**",
]
